<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ArteCanvas</title>
  <style>
      canvas{
          border: 3px solid black;
          background-color: black;
      }
  </style>

<script>
    //window.onload=function(){}
    var x = 0;
    var dx = 3;
    function animate(){
        requestAnimationFrame(animate);
        //console.log('animado');
        var canvas = document.getElementById("micanvas");
        var context = canvas.getContext("2d");
        context.clearRect(0, 0, innerWidth, innerHeight);
        context.fillStyle="grey";
        context.fillRect(210 + x, 110, 100, 100);
        context.fillRect(110 + x, 110, 100, 100);
        context.fillRect(310 + x, 110, 100, 100);
        context.fillRect(210 + x, 210, 100, 100);
        context.fillRect(110 + x, 310, 100, 100);
        context.fillRect(210 + x, 310, 100, 100);
        context.fillRect(310 + x, 310, 100, 100);
        context.fillRect(110 + x, 410, 100, 50);
        context.fillRect(310 + x, 410, 100, 50);


        context.fillStyle="lightgrey";
        context.fillRect(110 + x, 10, 100, 100);
        context.fillRect(210 + x, 10, 100, 100);
        context.fillRect(310 + x, 10, 100, 100);
        context.fillRect(410 + x, 110, 100, 100);
        context.fillRect(10 + x, 110, 100, 100);
        context.fillRect(110 + x, 210, 100, 100);
        context.fillRect(310 + x, 210, 100, 100);
        context.fillRect(10 + x, 210, 100, 100);
        context.fillRect(410 + x, 210, 100, 100);
        context.fillRect(10 + x, 310, 100, 100);
        context.fillRect(410 + x, 310, 100, 100);
        context.fillRect(210 + x, 410, 100, 100);
        context.fillRect(75 + x, 410, 100, 100);
        context.fillRect(335 + x, 410, 100, 100);

        if (x > 800 || x < 0){
                dx= -dx;
            }
        x+=dx;

    }
    animate();
</script>

  </head>
<body>
   <canvas id="micanvas" width="800" height="600"></canvas>
</body>
</html>
