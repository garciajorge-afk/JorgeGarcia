<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Proyecto</title>
    <style>
        body {
          text-align: center;
          background-color: rgb(0, 0, 0);
        }
        canvas {
          background-color:Red;
        }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1000" height="800"></canvas>
    <aside>Press arrow keys.</aside>
    
    <script src="keycodes.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById ("canvas");
      var context = canvas.getContext("2d");
      var x = 200;
      var y = 200;
      
      var image1 = new Image();
      image1.src = "DH1.jpg";
      var image2 = new Image();
      image2.src = "DH2.jpg";
      var image3 = new Image();
      image3.src = "DH3.jpg";
      var image4 = new Image();
      image4.src = "DH4.jpg";
      var image5 = new Image();
      image5.src = "DH5.jpg";
  
      function onKeyboardEvent (event) {
        switch (event.keyCode) {
        case keycode.UP:
          console.log("up!");
          context.clearRect(0,0, innerWidth, innerHeight);
          y-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.DOWN:
          console.log("down!");
          context.clearRect(0,0, innerWidth, innerHeight);
          y+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.LEFT:
          console.log("left!");
           context.clearRect(0,0, innerWidth, innerHeight);
          x-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.RIGHT:
          console.log("right!");
           context.clearRect(0,0, innerWidth, innerHeight);
          x+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.SPACE:
          console.log("Jump!");
          break;
        case keycode.A:
          console.log("Letra A!");
          context.clearRect(0,0, innerWidth, innerHeight);
          context.fillText('image1',x ,y );
          context.drawImage(image1, x, y+50, 200, 200);
          break;
        case keycode.B:
          console.log("Letra B!");
          context.clearRect(0,0, innerWidth, innerHeight);
          context.fillText('image2',x ,y );
          context.drawImage(image2, x, y+50, 200, 200);
          break;
        case keycode.C:
          console.log("Letra C!");
          context.clearRect(0,0, innerWidth, innerHeight);
          context.fillText('image3',x ,y );
          context.drawImage(image3, x, y+50, 200, 200);
          break;
        case keycode.D:
          console.log("Letra D!");
          context.clearRect(0,0, innerWidth, innerHeight);
          context.fillText('image4',x ,y );
          context.drawImage(image4, x, y+50, 200, 200);
          break;
        case keycode.E:
          console.log("Letra E!");
          context.clearRect(0,0, innerWidth, innerHeight);
          context.fillText('image5',x ,y);
          context.drawImage(image5, x, y+50, 200, 200);
          break;
        default:
          console.log(event.keyCode);
        }
      }

      window.addEventListener('keydown', onKeyboardEvent, false);
    };
    </script>
  </body>
</html>
